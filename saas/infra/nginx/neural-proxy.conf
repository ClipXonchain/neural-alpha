# Shared proxy settings. Goes in /etc/nginx/snippets/. The portal limits wrong access codes per
# visitor, and for that it must be told who the visitor is: nginx sets these itself, so a
# visitor cannot forge them.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_read_timeout 120s;
proxy_buffering off;   # the desk streams live updates
