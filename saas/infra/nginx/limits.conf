# http-level settings for the Neural Alpha portal. Goes in /etc/nginx/conf.d/.
server_tokens off;

# Per visitor address: the portal's sign-in, wallet and payment calls. These are the ones
# somebody would hammer. (The control plane also limits wrong access codes per visitor.)
limit_req_zone $binary_remote_addr zone=na_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=na_api:10m rate=600r/m;
limit_req_status 429;
