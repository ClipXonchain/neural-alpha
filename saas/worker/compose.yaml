# One customer. The bridge shares the worker network so it can see
# 127.0.0.1:3847 without changing neural-alpha's bind address.
# Build context is the neural-alpha repo root.

services:
  worker:
    build:
      context: ../..
      dockerfile: saas/worker/Dockerfile
      args:
        UPSTREAM_REF: agentic-wallet
    volumes:
      - tenant_data:/data
    environment:
      AGENT_MODE: paper
      HOME: /data/home
      DASHBOARD_PORT: "3847"
    ports:
      - "127.0.0.1:3848:3848"

  bridge:
    build:
      context: ../..
      dockerfile: saas/worker/bridge.Dockerfile
    network_mode: service:worker
    depends_on:
      - worker

volumes:
  tenant_data:
