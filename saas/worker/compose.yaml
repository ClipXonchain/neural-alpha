# Image definition for one customer container.
# saas/control starts this with a per-customer override. Do not run it
# by itself: that would have no private folder and no container name.

services:
  worker:
    image: neural-saas-worker:local
    build:
      context: ../..
      dockerfile: saas/worker/Dockerfile
  bridge:
    image: neural-saas-bridge:local
    build:
      context: ../..
      dockerfile: saas/worker/bridge.Dockerfile
    network_mode: service:worker
    depends_on:
      - worker
    restart: unless-stopped
