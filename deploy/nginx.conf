# Nginx — agents.clipx.app ONLY (safe add-on for multi-site VPS)
#
# Why this won't break clipx.app / chainmind.dev / etc.:
#   - server_name agents.clipx.app  → only this hostname uses this file
#   - upstream neural_*             → unique names (no clash with other configs)
#   - New file in sites-enabled     → existing symlinks untouched
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/agents.clipx.app
#   sudo ln -sf /etc/nginx/sites-available/agents.clipx.app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d agents.clipx.app
#   sudo nginx -t && sudo systemctl reload nginx
#
# Rollback (if anything wrong):
#   sudo rm /etc/nginx/sites-enabled/agents.clipx.app
#   sudo nginx -t && sudo systemctl reload nginx

upstream neural_dashboard {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream neural_agent_api {
    server 127.0.0.1:3847;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name agents.clipx.app;

    location = /api/health {
        proxy_pass http://neural_agent_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/agent/events {
        proxy_pass http://neural_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://neural_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After `certbot --nginx -d agents.clipx.app`, certbot adds the :443 server block
# and HTTP→HTTPS redirect automatically. Do NOT edit other sites in sites-enabled.
