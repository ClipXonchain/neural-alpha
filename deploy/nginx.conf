# Nginx config for agents.clipx.app
# Copy to: /etc/nginx/sites-available/agents.clipx.app
# Enable:  ln -s /etc/nginx/sites-available/agents.clipx.app /etc/nginx/sites-enabled/
# Reload:  sudo nginx -t && sudo systemctl reload nginx
# SSL:     sudo certbot --nginx -d agents.clipx.app

upstream dashboard {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream agent_api {
    server 127.0.0.1:3847;
    keepalive 8;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name agents.clipx.app;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agents.clipx.app;

    # SSL managed by Certbot (paths updated after `certbot --nginx`)
    # ssl_certificate     /etc/letsencrypt/live/agents.clipx.app/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agents.clipx.app/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── Security headers ───────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ─── Limits ─────────────────────────────────────────────────────
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ─── Agent API health (no auth, used by monitors) ──────────────
    location = /api/health {
        proxy_pass http://agent_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── SSE (long-lived connections) ───────────────────────────────
    location = /api/agent/events {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Dashboard (Next.js) — all routes ───────────────────────────
    location / {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js static assets cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            proxy_pass http://dashboard;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Block direct access to agent API from outside (only dashboard proxy)
    location /api/ {
        # Only the /api/agent/ path (dashboard proxy) is allowed
        # Direct /api/state etc. are blocked from the internet
        return 404;
    }

    # ─── Deny hidden files ──────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
