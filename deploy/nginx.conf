# Nginx — agents.clipx.app ONLY (safe add-on for multi-site VPS)
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/agents.clipx.app
#   sudo ln -sf /etc/nginx/sites-available/agents.clipx.app /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# First-time SSL (creates certs; may merge into this file):
#   sudo certbot --nginx -d agents.clipx.app
#   sudo nginx -t && sudo systemctl reload nginx
#
# If HTTPS returns 502 but PM2 shows dashboard Ready, certbot likely broke the
# :443 proxy block. Re-copy this file and reload nginx (certs already exist).

upstream neural_dashboard {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name agents.clipx.app;
    return 301 https://$host$request_uri;
}

# HTTPS — proxy everything to Next.js on localhost:3000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agents.clipx.app;

    ssl_certificate /etc/letsencrypt/live/agents.clipx.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agents.clipx.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /api/health {
        proxy_pass http://neural_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/agent/events {
        proxy_pass http://neural_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    location / {
        proxy_pass http://neural_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
